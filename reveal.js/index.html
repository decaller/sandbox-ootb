<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>Sandbox and Out of the Box - Pembelajaran Alamiyah</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/white.css" />
		<link rel="stylesheet" href="custom.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- Slide 1: Cover (Updated) -->
				<section data-background-color="#FCC6E8" class="slide-svg-view">
					<img src="assets/slides_png/slide-01.png" alt="Cover: Sandbox and out of the box" class="slide-svg-full" />
				</section>

				<!-- Slide 2: WHAT IS TO... UNDERSTAND ? -->
				<section data-background-color="#FCC6E8" class="slide-svg-view">
					<img src="assets/slides_svg/slide_2.svg" alt="What is to understand?" class="slide-svg-full" />
				</section>

				<!-- Slide 3: Gemini Shared Link -->
				<section data-background-color="#131314" class="slide-gemini">
					<div class="gemini-topbar">
						<div class="gemini-brand">
							<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
								<path d="M14 0C14 7.73199 7.73199 14 0 14C7.73199 14 14 20.268 14 28C14 20.268 20.268 14 28 14C20.268 14 14 7.73199 14 0Z" fill="url(#gemini_grad)"/>
								<defs>
									<linearGradient id="gemini_grad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
										<stop stop-color="#4E82EE"/>
										<stop offset="0.5" stop-color="#A56FF6"/>
										<stop offset="1" stop-color="#EA5275"/>
									</linearGradient>
								</defs>
							</svg>
							<span>Gemini Conversation</span>
							<span class="gemini-badge">Shared Session</span>
						</div>
						<a href="https://share.gemini.google/DEAutF18Smnq" target="_blank" rel="noopener noreferrer" class="gemini-open-btn">
							<span>Open in New Tab ↗</span>
						</a>
					</div>
					<div class="gemini-body">
						<div class="gemini-card">
							<div class="gemini-card-icon">
								<svg width="76" height="76" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
									<path d="M14 0C14 7.73199 7.73199 14 0 14C7.73199 14 14 20.268 14 28C14 20.268 20.268 14 28 14C20.268 14 14 7.73199 14 0Z" fill="url(#gemini_grad_large)"/>
									<defs>
										<linearGradient id="gemini_grad_large" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
											<stop stop-color="#4E82EE"/>
											<stop offset="0.5" stop-color="#A56FF6"/>
											<stop offset="1" stop-color="#EA5275"/>
										</linearGradient>
									</defs>
								</svg>
							</div>
							<h2 class="gemini-card-title">Shared Gemini Session</h2>
							<p class="gemini-card-desc">Sesi eksplorasi dan perumusan konsep sandbox vs out-of-the-box dalam Pembelajaran Alamiyah.</p>
							<a href="https://share.gemini.google/DEAutF18Smnq" target="_blank" rel="noopener noreferrer" class="gemini-card-btn">
								<span>Buka di Google Gemini</span>
								<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
							</a>
							<div class="gemini-card-meta">share.gemini.google/DEAutF18Smnq</div>
						</div>
						<iframe 
							src="https://share.gemini.google/DEAutF18Smnq" 
							class="gemini-iframe-overlay" 
							allow="clipboard-write; fullscreen"
							loading="lazy"
						></iframe>
					</div>
				</section>

				<!-- Slide 4: Interactive Simulation (Luas Geometri vs Integral) -->
				<section data-background-color="#0b0f19" class="slide-simulasi">
					<iframe 
						src="simulasi.html" 
						class="simulasi-iframe" 
						allowfullscreen
						loading="lazy"
					></iframe>
				</section>

				<!-- Slide 5: Template Slide 3 ("POLA" Cycle) -->
				<section data-background-color="#FE9F69" class="slide-svg-view">
					<img src="assets/slides_svg/slide_3.svg" alt="Pola Siklus Geometri" class="slide-svg-full" />
				</section>

				<!-- Slide 6: Template Slide 4 (Pola Yang Dibutuhkan) -->
				<section data-background-color="#FE9F69" class="slide-svg-view">
					<img src="assets/slides_svg/slide_4.svg" alt="Pola Yang Dibutuhkan" class="slide-svg-full" />
				</section>

				<!-- Slide 7: Template Slide 5 (Sandbox vs Out of the Box) -->
				<section data-background-color="#FE9F69" class="slide-svg-view">
					<img src="assets/slides_svg/slide_5.svg" alt="Sandbox vs Out of the Box" class="slide-svg-full" />
				</section>

				<!-- Slide 8: Template Slide 6 (Perencanaan) -->
				<section data-background-color="#FE9F69" class="slide-svg-view">
					<img src="assets/slides_svg/slide_6.svg" alt="Perencanaan Pertemuan 1 - 4" class="slide-svg-full" />
				</section>

				<!-- Slide 9: Template Slide 7 (Tahap SD & SMK) -->
				<section data-background-color="#BDDBE1" class="slide-svg-view">
					<img src="assets/slides_svg/slide_7.svg" alt="Tahap SD dan SMK" class="slide-svg-full" />
				</section>

				<!-- Slide 10: Template Slide 8 (Tahap Sandbox & OOTB) -->
				<section data-background-color="#BDDBE1" class="slide-svg-view">
					<img src="assets/slides_svg/slide_8.svg" alt="Tahap Sandbox dan Out of the Box" class="slide-svg-full" />
				</section>

				<!-- Slide 11: Template Slide 9 (Observasi & Dokumentasi Progress Murid) -->
				<section data-background-color="#FCC6E8" class="slide-svg-view">
					<img src="assets/slides_svg/slide_9.svg" alt="Observasi dan Dokumentasi Progress Murid" class="slide-svg-full" />
				</section>

				<!-- Slide 12: Template Slide 10 (Saatnya Berbelok) -->
				<section data-background-color="#FE9F69" class="slide-svg-view">
					<img src="assets/slides_svg/slide_10.svg" alt="Saatnya Berbelok" class="slide-svg-full" />
				</section>

				<!-- Slide 13: Template Slide 11 (Takeway) -->
				<section data-background-color="#BDDBE1" class="slide-svg-view">
					<img src="assets/slides_svg/slide_11.svg" alt="Takeway: Mengembalikan Firasat dalam Pendidikan" class="slide-svg-full" />
				</section>

				<!-- Slide 14: Template Slide 12 (Implementasi Insan Taqwa) -->
				<section data-background-color="#FCC6E8" class="slide-svg-view">
					<img src="assets/slides_png/slide-12.png" alt="Implementasi Insan Taqwa: Luar dan Dalam" class="slide-svg-full" />
				</section>

				<!-- Slide 15: Template Slide 13 (Alhamdulillah) -->
				<section data-background-color="#BDDBE1" class="slide-svg-view">
					<img src="assets/slides_svg/slide_13.svg" alt="Alhamdulillah - Penutup" class="slide-svg-full" />
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
			// Reveal.js configuration matching 16:9 widescreen presentation
			Reveal.initialize({
				hash: true,
				width: 1920,
				height: 1080,
				margin: 0,
				minScale: 0.1,
				maxScale: 2.0,
				center: false,

				// Plugins
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
